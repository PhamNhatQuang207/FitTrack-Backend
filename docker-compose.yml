# Local development stack: the backend API + a throwaway MongoDB, so you don't
# need Atlas to run locally. Start everything with:  docker compose up --build
#
# Values below can be overridden by a local .env file (gitignored) or your shell.
# Secrets here are LOCAL-ONLY placeholders — never use them in production.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"          # exposed so you can inspect with mongosh / Compass
    volumes:
      - mongo-data:/data/db    # persist data across `docker compose down`
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: .
    image: fittrack-backend:local
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      # NODE_ENV defaults to development here so local rate limiting is skipped
      # (see src/middleware/rateLimiter.js). Set NODE_ENV=production to mirror prod.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-fittrack}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Email is optional locally; unset keys just make sends fail gracefully.
      EMAIL_SERVICE: ${EMAIL_SERVICE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
