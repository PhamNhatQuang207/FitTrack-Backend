services:
  mongo:
    image: mongo:8.0
    container_name: fittrack-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - fittrack_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  fittrack_mongo_data:
