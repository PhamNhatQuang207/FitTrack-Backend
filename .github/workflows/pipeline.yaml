name: Backend-Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # ubuntu-latest is now Ubuntu 24.04, which dropped the libssl1.1 that the
      # default mongod binary needs, so mongodb-memory-server fails to start there.
      # Running on 22.04 (libssl3) and pinning a known-good MongoDB build keeps the
      # integration tests reliable and reproducible in CI.
      MONGOMS_VERSION: '7.0.14'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  # Validates that the production image still builds. Build-only (no push):
  # Render deploys the Native Node runtime, so there is no image consumer yet.
  # Add push-to-registry here later if the image gets a consumer.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fittrack-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
